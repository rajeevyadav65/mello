version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: melodia-postgres
    environment:
      POSTGRES_DB: melodia
      POSTGRES_USER: melodia
      POSTGRES_PASSWORD: melodia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: melodia-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: melodia-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: melodia-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: melodia-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    container_name: melodia-backend
    depends_on:
      - postgres
      - mongo
      - redis
      - elasticsearch
      - minio
    environment:
      DB_HOST: postgres
      MONGO_HOST: mongo
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      JWT_SECRET: local-dev-secret-change-in-production-min-256-bits
      SERVER_PORT: 8082
    ports:
      - "8082:8082"

volumes:
  postgres_data:
  mongo_data:
  es_data:
  minio_data:
